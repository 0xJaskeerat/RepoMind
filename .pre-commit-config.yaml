repos:
  # 1. General repository hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace       # Trims trailing whitespace
      - id: end-of-file-fixer         # Ensures files end with a newline
      - id: check-yaml                # Verifies YAML syntax
      - id: check-added-large-files   # Prevents accidental commits of huge files
        args: ['--maxkb=1000']
      - id: detect-private-key        # Prevents committing private SSH/crypto keys

  # 2. Python linting and formatting with Ruff (extremely fast)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff                      # Linter (with auto-fix)
        args: [--fix]
      - id: ruff-format               # Formatter (replaces Black)
